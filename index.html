<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <!-- Header Section Starts -->
    <header>
        <div class="content">
            <div class="logo"><i class="fa-solid fa-paw"></i> <span>Bo Ma</span></div>
            <nav class="navbar">
                <a href="" class="nav-link">Home</a>
                <a href="" class="nav-link">About</a>
                <a href="" class="nav-link">Servie</a>
                <a href="" class="nav-link">Shop</a>
                <a href="" class="nav-link">Plan</a>
                <a href="" class="nav-link">Contact</a>
            </nav>
            <div class="menu">
                <div class="fa-solid fa-bars menu-link" id="menu-icon"></div>
                <div class="fa-solid fa-shopping-cart menu-link"></div>
                <i class="fa-solid fa-user menu-link" id="login-btn"></i>
            </div>
            <form action="" class="login-form">
                <h3>Sign In</h3>
                <input type="email" name="email" id="" class="input-box" placeholder="Enter your password ...">
                <input type="password" name="password" id="" class="input-box" placeholder="Enter your password ...">
                <div class="remember">
                    <input type="checkbox" name="" id="remember-me"><label for="remember-me">Remember me</label>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <div class="login-link">
                    <a href="" class="form-link">forgot password?</a>
                    <a href="" class="form-link">Sign up</a>
                </div>
            </form>
        </div>
    </header>
    <!-- Header Section Ends -->

    <!-- Header Section Starts -->

    <section class="home">

        <div class="home-text">
            <h3>Welcome to <span>Bo Ma</span></h3>
            <p>
                Your trusted destination for healthy pets, premium pet food.
                We believe every pet deserves the best care, comfort, and love.
            </p>
            <a href="#" class="btn btn-primary">Shop Now</a>
        </div>

    </section>

    <!-- Header Section Ends -->



    <script src="script.js"></script>
</body>

</html>
